<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Analyse des Avis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>
</head>
<body>
    <h1><i class="fas fa-chart-bar"></i> Tableau de bord administrateur</h1>

    <form method="POST" class="filter-form" id="filter-form">
        <div class="form-group">
            <label for="produit"><i class="fas fa-box"></i> Produit :</label>
            <select id="produit" name="produit" onchange="document.getElementById('filter-form').submit();">
                {% for produit in produits %}
                    <option value="{{ produit.nom }}" {% if produit.nom == produit_selectionne %}selected{% endif %}>
                        {{ produit.titre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="sentiment"><i class="fas fa-smile"></i> Sentiment :</label>
            <select id="sentiment" name="sentiment" onchange="document.getElementById('filter-form').submit();">
                <option value="Tous" {% if sentiment_filter == 'Tous' %}selected{% endif %}>Tous</option>
                <option value="Positif" {% if sentiment_filter == 'Positif' %}selected{% endif %}>Positif</option>
                <option value="Négatif" {% if sentiment_filter == 'Négatif' %}selected{% endif %}>Négatif</option>
            </select>
        </div>

        <div class="form-group">
            <label for="periode"><i class="fas fa-calendar-alt"></i> Période :</label>
            <input type="text" id="periode" name="periode" placeholder="Sélectionnez une période" value="{{ periode if periode }}">
            <!--<small>Format : YYYY-MM-DD to YYYY-MM-DD</small>-->
        </div>

        <a href="/export" class="export-btn"><i class="fas fa-file-csv"></i> Exporter CSV</a>
    </form>

    <div class="chart-container">
        <canvas id="donutChart"></canvas>
    </div>

    <h2><i class="fas fa-comments"></i> Liste des Commentaires</h2>
    <table>
        <thead>
            <tr>
                <th>Produit</th>
                <th>Commentaire</th>
                <th>Sentiment</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for index, row in data.iterrows() %}
            <tr>
                <td>{{ row['Produit'] }}</td>
                <td>{{ row['Commentaire'] }}</td>
                <td>{{ 'Positif' if row['Sentiment']|int == 1 else 'Négatif' }}</td>
                <td>{{ row['Date'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        const ctx = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Positif', 'Négatif'],
                datasets: [{
                    data: [{{ chart_data.positif }}, {{ chart_data.negatif }}],
                    backgroundColor: ['#28a745', '#dc3545']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    title: {
                        display: true,
                        text: 'Répartition des Avis Positifs/Négatifs'
                    }
                }
            }
        });

        flatpickr("#periode", {
            mode: "range",
            dateFormat: "Y-m-d",
            locale: "fr",
            conjunction: " au ",
            onClose: function(selectedDates, dateStr, instance) {
                document.getElementById('filter-form').submit();
            }
        });
    </script>
</body>
</html>
